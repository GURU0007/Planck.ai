<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>planck.ai — Live Spectator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom clean scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    html, body {
      height: 100%;
      overscroll-behavior: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen h-[100dvh] max-h-[100dvh] flex flex-col overflow-hidden">

  <!-- TOP SPECTATOR HEADER -->
  <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-2.5 flex items-center justify-between shrink-0 shadow-2xs z-20">
    <div class="flex items-center space-x-2.5 sm:space-x-3 shrink-0">
      <div class="bg-gradient-to-br from-indigo-600 to-indigo-900 text-amber-300 p-1.5 sm:p-2 rounded-xl shadow-md flex items-center justify-center ring-2 ring-indigo-500/20">
        <i data-lucide="zap" class="w-4 h-4 sm:w-5 sm:h-5 fill-amber-300 text-amber-300"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-base sm:text-lg text-slate-900 tracking-tight leading-tight flex items-center gap-1.5">
          planck<span class="text-indigo-600">.ai</span>
          <span class="text-[10px] bg-indigo-100 text-indigo-700 font-bold px-1.5 py-0.5 rounded uppercase tracking-wider">Spectator</span>
        </h1>
      </div>
    </div>

    <!-- Spectator Status Controls -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Live Room Badge -->
      <div class="flex items-center gap-1.5 bg-slate-100 border border-slate-200 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-mono font-semibold shrink-0">
        <span class="text-slate-400">Room:</span>
        <span id="roomIdDisplay">...</span>
      </div>

      <!-- Host Connection Indicator -->
      <div id="hostStatusBadge" class="flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0">
        <span id="hostStatusDot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
        <span id="hostStatusText">Connecting...</span>
      </div>

      <!-- Optional Audio Whisper for Spectator -->
      <button id="specWhisperToggle" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-2xs transition" title="Listen to AI answers in your earbuds">
        <i data-lucide="headphones" class="w-3.5 h-3.5 text-indigo-600"></i>
        <span id="specWhisperText" class="hidden sm:inline">Audio: OFF</span>
      </button>
    </div>
  </header>

  <!-- PIN REQUIRED OVERLAY (If room is password protected) -->
  <div id="pinModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl border border-slate-200 p-6 space-y-4 mx-4">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto shadow-2xs">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-900">Protected Session</h3>
        <p class="text-xs text-slate-500">The host has protected this live session with a PIN.</p>
      </div>

      <div>
        <input type="text" id="pinInput" placeholder="Enter PIN" class="w-full text-center text-lg font-mono tracking-widest bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" maxlength="6" />
        <p id="pinError" class="text-xs text-rose-600 mt-1.5 text-center hidden font-medium">Incorrect PIN. Please try again.</p>
      </div>

      <button id="submitPinBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow-md transition">
        Join Live Session
      </button>
    </div>
  </div>

  <!-- MAIN WORKSPACE: SINGLE WINDOW WITH 3 VERTICAL PARTS (BLANK LEFT 1/3, MIDDLE 1/3 CONTENT, BLANK RIGHT 1/3) -->
  <main class="flex-1 min-h-0 w-full overflow-hidden flex flex-row bg-slate-100">
    <!-- LEFT 1/3: BLANK SPACE -->
    <div class="hidden md:block md:w-1/3 bg-slate-100/70"></div>

    <!-- MIDDLE 1/3: SINGLE OTTER WINDOW WITH AUTO-SCROLL -->
    <div id="specScrollContainer" class="w-full md:w-1/3 bg-white border-x border-slate-200/80 flex flex-col h-full overflow-y-auto shadow-sm">
      <div id="specFeed" class="p-4 sm:p-6 space-y-3.5 min-h-full flex flex-col justify-start">
        <!-- Initial Empty State -->
        <div id="specEmptyPlaceholder" class="my-auto py-16 flex flex-col items-center justify-center text-slate-400 space-y-2">
          <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center shadow-xs">
            <i data-lucide="radio" class="w-6 h-6"></i>
          </div>
          <p class="font-bold text-slate-700 text-sm">Live Otter Feed</p>
          <p class="text-xs text-center max-w-xs text-slate-400">
            Waiting for speech. Transcribed speech and live AI talking points will appear and auto-scroll here in real-time.
          </p>
        </div>
      </div>
    </div>

    <!-- RIGHT 1/3: BLANK SPACE -->
    <div class="hidden md:block md:w-1/3 bg-slate-100/70"></div>
  </main>

  <script>
    // Spectator Client Logic
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    let roomPin = urlParams.get('pin') || '';

    let specWs = null;
    let specWhisperEnabled = false;

    // DOM Elements
    const roomIdDisplay = document.getElementById('roomIdDisplay');
    const hostStatusBadge = document.getElementById('hostStatusBadge');
    const hostStatusDot = document.getElementById('hostStatusDot');
    const hostStatusText = document.getElementById('hostStatusText');
    const specScrollContainer = document.getElementById('specScrollContainer');
    const specFeed = document.getElementById('specFeed');
    const specEmptyPlaceholder = document.getElementById('specEmptyPlaceholder');
    const specWhisperToggle = document.getElementById('specWhisperToggle');
    const specWhisperText = document.getElementById('specWhisperText');

    const pinModal = document.getElementById('pinModal');
    const pinInput = document.getElementById('pinInput');
    const pinError = document.getElementById('pinError');
    const submitPinBtn = document.getElementById('submitPinBtn');

    roomIdDisplay.textContent = roomId;

    // Auto-scroll helper: keeps view pinned to the bottom as text appears
    function scrollToBottom() {
      if (specScrollContainer) {
        specScrollContainer.scrollTop = specScrollContainer.scrollHeight;
      }
    }

    function connectSpectator() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws?spectator=true&roomId=${encodeURIComponent(roomId)}&pin=${encodeURIComponent(roomPin)}`;

      specWs = new WebSocket(wsUrl);

      specWs.onopen = () => {
        console.log('[Spectator] Connected to room:', roomId);
        hostStatusBadge.className = 'flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
        hostStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-ping';
        hostStatusText.textContent = 'Live Active';
      };

      specWs.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleSpectatorMessage(data);
        } catch (e) {
          console.error('[Spectator] Parse error:', e);
        }
      };

      specWs.onclose = () => {
        hostStatusBadge.className = 'flex items-center gap-1.5 bg-slate-100 border border-slate-200 text-slate-500 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
        hostStatusDot.className = 'w-2 h-2 rounded-full bg-slate-400';
        hostStatusText.textContent = 'Disconnected';
        setTimeout(connectSpectator, 3000); // Auto-reconnect
      };
    }

    // Active block tracking in the single window feed
    let activeSpecBubble = null;
    let specTurnAccumulator = [];
    let lastSpecBubbleTime = 0;
    let activeAiBlock = null;
    let currentAiAnswerText = '';

    function handleSpectatorMessage(data) {
      if (data.type === 'pin_required') {
        pinModal.classList.remove('hidden');
        pinError.classList.remove('hidden');
        return;
      }

      if (data.type === 'session_init') {
        pinModal.classList.add('hidden');
        if (data.hostActive) {
          hostStatusBadge.className = 'flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
          hostStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-ping';
          hostStatusText.textContent = 'Host Active';
        } else {
          hostStatusBadge.className = 'flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
          hostStatusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
          hostStatusText.textContent = 'Host Standing By';
        }

        // Render past history turns if joining mid-session
        if (data.history && data.history.length > 0) {
          if (specEmptyPlaceholder) specEmptyPlaceholder.classList.add('hidden');
          data.history.forEach(turn => {
            renderSpectatorTranscript(turn.question, true, 'Speaker');
            if (turn.answer) {
              renderInlineAiAnswer(turn.answer, false);
            }
          });
          scrollToBottom();
        } else if (data.currentQuestion) {
          if (specEmptyPlaceholder) specEmptyPlaceholder.classList.add('hidden');
          renderSpectatorTranscript(data.currentQuestion, true, 'Speaker');
          if (data.currentAnswer) {
            renderInlineAiAnswer(data.currentAnswer, false);
          }
          scrollToBottom();
        }
      }

      if (data.type === 'transcript') {
        if (specEmptyPlaceholder) specEmptyPlaceholder.classList.add('hidden');
        const speakerLabel = data.speaker !== null && data.speaker !== undefined ? `Speaker ${data.speaker + 1}` : 'Speaker';
        renderSpectatorTranscript(data.text, data.isFinal, speakerLabel);
        scrollToBottom();
      }

      if (data.type === 'answer_start') {
        if (specEmptyPlaceholder) specEmptyPlaceholder.classList.add('hidden');
        currentAiAnswerText = '';
        createInlineAiBlock(data.question);
        scrollToBottom();
      }

      if (data.type === 'answer_token') {
        currentAiAnswerText += data.token;
        updateInlineAiBlock(currentAiAnswerText);
        scrollToBottom();
      }

      if (data.type === 'answer_done') {
        finalizeInlineAiBlock();
        if (specWhisperEnabled && currentAiAnswerText) {
          speakSpectatorWhisper(currentAiAnswerText);
        }
        scrollToBottom();
      }

      if (data.type === 'host_status') {
        if (data.active) {
          hostStatusBadge.className = 'flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
          hostStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-ping';
          hostStatusText.textContent = 'Host Active';
        } else {
          hostStatusBadge.className = 'flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
          hostStatusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
          hostStatusText.textContent = 'Host Standing By';
        }
      }
    }

    // 1. Render Live Speech Paragraphs in the Single Window
    function renderSpectatorTranscript(text, isFinal, speakerLabel) {
      const now = Date.now();
      if (now - lastSpecBubbleTime > 3000 && activeSpecBubble) {
        activeSpecBubble = null;
        specTurnAccumulator = [];
      }
      lastSpecBubbleTime = now;

      if (!activeSpecBubble) {
        activeSpecBubble = document.createElement('div');
        activeSpecBubble.className = 'p-3 bg-slate-50 border border-slate-200/80 rounded-xl space-y-1.5 transition';
        const initial = speakerLabel.charAt(0).toUpperCase();
        activeSpecBubble.innerHTML = `
          <div class="flex items-center justify-between text-xs text-slate-500">
            <span class="font-bold text-slate-800 flex items-center gap-1.5">
              <span class="w-5 h-5 rounded-md bg-indigo-100 text-indigo-700 text-[10px] font-extrabold flex items-center justify-center">${initial}</span>
              <span class="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></span>
              <span>${escapeHtml(speakerLabel)}</span>
            </span>
            <span class="font-mono text-[10px] text-slate-400">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
          <p class="text-xs sm:text-sm text-slate-800 leading-relaxed font-medium spec-bubble-text"></p>
        `;
        specFeed.appendChild(activeSpecBubble);
        specTurnAccumulator = [];
      }

      if (isFinal && text.trim()) {
        specTurnAccumulator.push(text.trim());
      }

      const fullText = specTurnAccumulator.length > 0
        ? (isFinal ? specTurnAccumulator.join(' ') : specTurnAccumulator.join(' ') + ' ' + text)
        : text;

      const p = activeSpecBubble.querySelector('.spec-bubble-text');
      if (p) {
        p.textContent = fullText;
      }

      if (isFinal) {
        const dot = activeSpecBubble.querySelector('.animate-ping');
        if (dot) dot.classList.remove('animate-ping');
        const trimmed = text.trim();
        const wordCount = fullText.trim().split(/\s+/).filter(Boolean).length;
        if (trimmed.endsWith('?') || wordCount >= 30) {
          activeSpecBubble = null;
          specTurnAccumulator = [];
        }
      }
    }

    // 2. Render Inline AI Talking Points inside the Single Window
    function createInlineAiBlock(question) {
      activeAiBlock = document.createElement('div');
      activeAiBlock.className = 'my-2.5 p-3.5 bg-gradient-to-br from-indigo-50/70 to-purple-50/40 border border-indigo-200/80 rounded-xl space-y-2 shadow-2xs';
      activeAiBlock.innerHTML = `
        <div class="flex items-center justify-between border-b border-indigo-100/80 pb-2">
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
            <span class="text-xs font-bold text-indigo-900 flex items-center gap-1">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-600"></i>
              <span>AI Talking Points</span>
            </span>
          </div>
          <span class="text-[10px] font-mono text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.2 rounded font-semibold">Groq LPU (~120ms)</span>
        </div>
        <div class="spec-ai-content text-xs sm:text-sm text-slate-800 space-y-1.5 leading-snug">
          <p class="text-xs text-indigo-500 italic flex items-center gap-1.5">
            <span class="w-3 h-3 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></span>
            <span>Generating points...</span>
          </p>
        </div>
      `;
      specFeed.appendChild(activeAiBlock);
      lucide.createIcons();
    }

    function updateInlineAiBlock(rawText) {
      if (!activeAiBlock) return;
      const contentDiv = activeAiBlock.querySelector('.spec-ai-content');
      if (!contentDiv) return;

      const cleanLines = rawText.split('\n').filter(l => l.trim().length > 0);
      let html = '';
      cleanLines.forEach(line => {
        let clean = line.replace(/^\s*[-*•]\s*/, '').replace(/^\s*\d+\.\s*/, '').trim();
        if (clean) {
          html += `
            <div class="flex items-start gap-2 bg-white/90 p-2 rounded-lg border border-indigo-100/70 shadow-2xs">
              <span class="text-indigo-600 font-bold shrink-0 mt-0.5">⚡</span>
              <span class="text-xs sm:text-[13px] text-slate-800 leading-snug font-medium">${escapeHtml(clean)}</span>
            </div>
          `;
        }
      });
      contentDiv.innerHTML = html || `<p class="text-xs text-indigo-400 italic">Streaming...</p>`;
    }

    function finalizeInlineAiBlock() {
      if (!activeAiBlock) return;
      const pulseDot = activeAiBlock.querySelector('.animate-pulse');
      if (pulseDot) pulseDot.classList.remove('animate-pulse');
      activeAiBlock = null;
    }

    function renderInlineAiAnswer(rawText, isStreaming) {
      createInlineAiBlock('');
      updateInlineAiBlock(rawText);
      finalizeInlineAiBlock();
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // PIN Submission
    submitPinBtn.addEventListener('click', () => {
      const val = pinInput.value.trim();
      if (val) {
        roomPin = val;
        pinModal.classList.add('hidden');
        if (specWs) specWs.close();
        connectSpectator();
      }
    });

    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitPinBtn.click();
      }
    });

    // Optional Spectator Whisper
    specWhisperToggle.addEventListener('click', () => {
      specWhisperEnabled = !specWhisperEnabled;
      if (specWhisperEnabled) {
        specWhisperToggle.className = 'border border-emerald-500 bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-2xs transition';
        specWhisperText.textContent = 'Audio: ON';
        if ('speechSynthesis' in window) {
          const silent = new SpeechSynthesisUtterance(' ');
          window.speechSynthesis.speak(silent);
        }
      } else {
        specWhisperToggle.className = 'border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-2xs transition';
        specWhisperText.textContent = 'Audio: OFF';
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    });

    function speakSpectatorWhisper(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.replace(/[*_#`-]/g, ''));
      utterance.rate = 1.25;
      window.speechSynthesis.speak(utterance);
    }

    // Initialize
    connectSpectator();
    lucide.createIcons();
  </script>
</body>
</html>
