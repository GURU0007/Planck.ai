<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>planck.ai — Live Teleprompter</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom visible clean scrollbar for upper prompt history */
    #historyScrollContainer::-webkit-scrollbar {
      width: 6px;
    }
    #historyScrollContainer::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    #historyScrollContainer::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    #historyScrollContainer::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    html, body {
      height: 100%;
      overscroll-behavior: none;
    }
    /* Elegant top fade mask for older rolled-up prompts */
    .mask-top-fade {
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen h-[100dvh] max-h-[100dvh] flex flex-col overflow-hidden select-none">

  <!-- TOP SPECTATOR HEADER -->
  <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-2.5 flex items-center justify-between shrink-0 shadow-2xs z-20">
    <div class="flex items-center space-x-2.5 sm:space-x-3 shrink-0">
      <div class="bg-gradient-to-br from-indigo-600 to-indigo-900 text-amber-300 p-1.5 sm:p-2 rounded-xl shadow-md flex items-center justify-center ring-2 ring-indigo-500/20">
        <i data-lucide="zap" class="w-4 h-4 sm:w-5 sm:h-5 fill-amber-300 text-amber-300"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-base sm:text-lg text-slate-900 tracking-tight leading-tight flex items-center gap-1.5">
          planck<span class="text-indigo-600">.ai</span>
          <span class="text-[10px] bg-indigo-100 text-indigo-700 font-bold px-1.5 py-0.5 rounded uppercase tracking-wider">Teleprompter</span>
        </h1>
      </div>
    </div>

    <!-- Spectator Status Controls -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Live Room Badge -->
      <div class="flex items-center gap-1.5 bg-slate-100 border border-slate-200 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-mono font-semibold shrink-0">
        <span class="text-slate-400">Room:</span>
        <span id="roomIdDisplay">...</span>
      </div>

      <!-- Host Connection Indicator -->
      <div id="hostStatusBadge" class="flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0">
        <span id="hostStatusDot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
        <span id="hostStatusText">Connecting...</span>
      </div>

      <!-- Optional Audio Whisper for Spectator -->
      <button id="specWhisperToggle" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-2xs transition" title="Listen to AI answers in your earbuds">
        <i data-lucide="headphones" class="w-3.5 h-3.5 text-indigo-600"></i>
        <span id="specWhisperText" class="hidden sm:inline">Audio: OFF</span>
      </button>
    </div>
  </header>

  <!-- PIN REQUIRED OVERLAY (If room is password protected) -->
  <div id="pinModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl border border-slate-200 p-6 space-y-4 mx-4">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto shadow-2xs">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-900">Protected Session</h3>
        <p class="text-xs text-slate-500">The host has protected this live session with a PIN.</p>
      </div>

      <div>
        <input type="text" id="pinInput" placeholder="Enter PIN" class="w-full text-center text-lg font-mono tracking-widest bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" maxlength="6" />
        <p id="pinError" class="text-xs text-rose-600 mt-1.5 text-center hidden font-medium">Incorrect PIN. Please try again.</p>
      </div>

      <button id="submitPinBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow-md transition">
        Join Live Session
      </button>
    </div>
  </div>

  <!-- MAIN WORKSPACE: 3 VERTICAL PARTS (LEFT 1/3 BLANK, MIDDLE 1/3 TELEPROMPTER, RIGHT 1/3 BLANK) -->
  <main class="flex-1 min-h-0 w-full overflow-hidden flex flex-row bg-slate-100">
    <!-- LEFT 1/3: BLANK SPACE -->
    <div class="hidden md:block md:w-1/3 bg-slate-100/70"></div>

    <!-- MIDDLE 1/3: PURE TELEPROMPTER STAGE -->
    <div class="w-full md:w-1/3 h-full flex flex-col justify-between relative overflow-hidden bg-white border-x border-slate-200/80 shadow-sm">
      
      <!-- TOP 50%: PREVIOUS CONTINUOUS PROMPTS (SCROLLABLE, NATURALLY FLOWING SENTENCES SEPARATED BY FULL STOPS) -->
      <div id="historyScrollContainer" class="flex-1 w-full overflow-y-auto px-6 sm:px-10 py-5 mask-top-fade overscroll-contain select-text">
        <div id="historyFeed" class="min-h-full flex flex-col">
          <div id="continuousTextFlow" class="mt-auto space-y-4 text-slate-400 text-base sm:text-lg leading-relaxed font-normal">
            <!-- Continuous speech sentences roll up here separated by full stops -->
          </div>
        </div>
      </div>

      <!-- EXACT VERTICAL CENTER LINE: FRESH PROMPT (LOCKED AT EYE LEVEL) -->
      <div id="centerPromptArea" class="w-full px-6 sm:px-10 py-5 bg-white z-10 shrink-0 border-t border-b border-indigo-100/70">
        <div class="flex items-start">
          <p id="liveCenterPrompt" class="text-xl sm:text-2xl font-bold text-slate-900 leading-relaxed break-words flex-1">
            <span id="centerPromptText" class="text-slate-400 font-normal italic text-base sm:text-lg">Waiting for speech... Words will appear here in the center</span>
            <span id="centerPromptCursor" class="inline-block w-2.5 h-6 bg-indigo-600 ml-1.5 align-middle animate-pulse rounded-xs"></span>
          </p>
        </div>

        <!-- Clean AI Talking Points (if question was answered) -->
        <div id="centerAiWrapper" class="mt-3 pt-2.5 border-t border-slate-100 hidden">
          <div class="flex items-center gap-1.5 text-xs font-bold text-indigo-600 mb-1.5">
            <span class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
            <span>AI Talking Points:</span>
          </div>
          <div id="centerAiContent" class="space-y-1.5 text-xs sm:text-sm text-slate-700 bg-indigo-50/60 p-2.5 rounded-xl border border-indigo-100/80"></div>
        </div>
      </div>

      <!-- BOTTOM 50%: DOWN NOT NEEDED (CLEAN EMPTY WHITE SPACE) -->
      <div class="flex-1 w-full bg-white pointer-events-none">
        <!-- Down is not needed: kept 100% clean so eyes never look down! -->
      </div>

    </div>

    <!-- RIGHT 1/3: BLANK SPACE -->
    <div class="hidden md:block md:w-1/3 bg-slate-100/70"></div>
  </main>

  <script>
    // Spectator Client Logic
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    let roomPin = urlParams.get('pin') || '';

    let specWs = null;
    let specWhisperEnabled = false;

    // DOM Elements
    const roomIdDisplay = document.getElementById('roomIdDisplay');
    const hostStatusBadge = document.getElementById('hostStatusBadge');
    const hostStatusDot = document.getElementById('hostStatusDot');
    const hostStatusText = document.getElementById('hostStatusText');
    const specWhisperToggle = document.getElementById('specWhisperToggle');
    const specWhisperText = document.getElementById('specWhisperText');

    const pinModal = document.getElementById('pinModal');
    const pinInput = document.getElementById('pinInput');
    const pinError = document.getElementById('pinError');
    const submitPinBtn = document.getElementById('submitPinBtn');

    // Teleprompter DOM Elements
    const historyScrollContainer = document.getElementById('historyScrollContainer');
    const continuousTextFlow = document.getElementById('continuousTextFlow');
    const centerPromptText = document.getElementById('centerPromptText');
    const centerPromptCursor = document.getElementById('centerPromptCursor');
    const centerAiWrapper = document.getElementById('centerAiWrapper');
    const centerAiContent = document.getElementById('centerAiContent');

    roomIdDisplay.textContent = roomId;

    // Active Continuous Prompt State
    let isInitialWaiting = true;
    let accumulatedPromptWords = [];
    let lastChunkTime = 0;
    let currentParagraph = null;
    let sentenceCountInParagraph = 0;
    let lastSentenceTime = 0;
    let currentAiAnswerText = '';

    // Scrollability & Manual Scroll Detection
    let isUserScrolledUp = false;
    historyScrollContainer.addEventListener('scroll', () => {
      const distanceToBottom = historyScrollContainer.scrollHeight - historyScrollContainer.scrollTop - historyScrollContainer.clientHeight;
      isUserScrolledUp = distanceToBottom > 40;
    });

    function connectSpectator() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws?spectator=true&roomId=${encodeURIComponent(roomId)}&pin=${encodeURIComponent(roomPin)}`;

      specWs = new WebSocket(wsUrl);

      let specHeartbeat = null;
      specWs.onopen = () => {
        console.log('[Spectator] Connected to room:', roomId);
        hostStatusBadge.className = 'flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
        hostStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-ping';
        hostStatusText.textContent = 'Live Active';
        if (specHeartbeat) clearInterval(specHeartbeat);
        specHeartbeat = setInterval(() => {
          if (specWs && specWs.readyState === WebSocket.OPEN) {
            specWs.send(JSON.stringify({ type: 'ping' }));
          }
        }, 10000);
      };

      specWs.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleSpectatorMessage(data);
        } catch (e) {
          console.error('[Spectator] Parse error:', e);
        }
      };

      specWs.onclose = () => {
        if (specHeartbeat) clearInterval(specHeartbeat);
        hostStatusBadge.className = 'flex items-center gap-1.5 bg-slate-100 border border-slate-200 text-slate-500 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
        hostStatusDot.className = 'w-2 h-2 rounded-full bg-slate-400';
        hostStatusText.textContent = 'Disconnected';
        setTimeout(connectSpectator, 3000); // Auto-reconnect
      };
    }

    function handleSpectatorMessage(data) {
      if (data.type === 'pin_required') {
        pinModal.classList.remove('hidden');
        pinError.classList.remove('hidden');
        return;
      }

      if (data.type === 'session_init') {
        pinModal.classList.add('hidden');
        if (data.hostActive) {
          hostStatusBadge.className = 'flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
          hostStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-ping';
          hostStatusText.textContent = 'Host Active';
        } else {
          hostStatusBadge.className = 'flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
          hostStatusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
          hostStatusText.textContent = 'Host Standing By';
        }

        // Render past history turns into continuous natural paragraphs
        if (data.history && data.history.length > 0) {
          data.history.forEach(turn => {
            if (turn.question) rollPromptUpToHistory(turn.question);
            if (turn.answer) rollAiAnswerToHistory(turn.answer);
          });
        }
      }

      // LIVE SPEECH TRANSCRIPT: PROMPT AT EXACT CENTER LINE
      if (data.type === 'transcript') {
        handleCenterTranscript(data.text, data.isFinal);
      }

      // AI TALKING POINTS
      if (data.type === 'answer_start') {
        currentAiAnswerText = '';
        centerAiWrapper.classList.remove('hidden');
        centerAiContent.innerHTML = '<p class="text-xs text-indigo-500 italic flex items-center gap-1.5"><span class="w-2.5 h-2.5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></span><span>Generating talking points...</span></p>';
      }

      if (data.type === 'answer_token') {
        currentAiAnswerText += data.token;
        updateCenterAiContent(currentAiAnswerText);
      }

      if (data.type === 'answer_done') {
        if (specWhisperEnabled && currentAiAnswerText) {
          speakSpectatorWhisper(currentAiAnswerText);
        }
      }

      if (data.type === 'host_status') {
        if (data.active) {
          hostStatusBadge.className = 'flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
          hostStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-ping';
          hostStatusText.textContent = 'Host Active';
        } else {
          hostStatusBadge.className = 'flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-800 px-2.5 py-1 rounded-lg text-xs font-semibold shrink-0';
          hostStatusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
          hostStatusText.textContent = 'Host Standing By';
        }
      }
    }

    // 1. LIVE CENTER PROMPTER ENGINE:
    // Prompt is locked in the EXACT CENTER. Once it completes a certain length (~12-14 words or punctuation),
    // it rolls UP to history, joining the continuous paragraph separated by full stops. Down is never used!
    function handleCenterTranscript(text, isFinal) {
      if (!text || !text.trim()) return;

      const now = Date.now();
      // If user paused speaking for > 3.5 seconds, roll previous completed sentence up
      if (now - lastChunkTime > 3500 && accumulatedPromptWords.length > 0) {
        rollPromptUpToHistory(accumulatedPromptWords.join(' '));
        accumulatedPromptWords = [];
      }
      lastChunkTime = now;

      if (isInitialWaiting) {
        isInitialWaiting = false;
        centerPromptText.className = 'text-slate-900 font-bold';
      }

      if (isFinal) {
        accumulatedPromptWords.push(text.trim());
      }

      const activeDisplay = accumulatedPromptWords.length > 0
        ? (isFinal ? accumulatedPromptWords.join(' ') : accumulatedPromptWords.join(' ') + ' ' + text.trim())
        : text.trim();

      centerPromptText.textContent = activeDisplay;

      // LENGTH THRESHOLD & SENTENCE BOUNDARY:
      // When finalized text reaches ~12-14 words or completes a sentence with period/question:
      const wordCount = activeDisplay.split(/\s+/).filter(Boolean).length;
      const isSentenceEnd = activeDisplay.endsWith('.') || activeDisplay.endsWith('?') || activeDisplay.endsWith('!');

      if (isFinal && (wordCount >= 12 || isSentenceEnd)) {
        // Roll up into continuous flowing paragraph!
        rollPromptUpToHistory(activeDisplay);
        accumulatedPromptWords = [];
        centerPromptText.textContent = '';
      } else if (!isFinal && wordCount >= 18) {
        // Interim speech exceeded 18 words without pause: roll first 12 words up to continuous paragraph!
        const words = activeDisplay.split(/\s+/).filter(Boolean);
        const rollWords = words.slice(0, 12).join(' ');
        const keepWords = words.slice(12).join(' ');
        rollPromptUpToHistory(rollWords);
        accumulatedPromptWords = [keepWords];
        centerPromptText.textContent = keepWords;
      }
    }

    // 2. ROLL UP INTO CONTINUOUS PARAGRAPHS SEPARATED BY FULL STOPS:
    // No bullet fragmentation! Sentences join naturally in a continuous flowing paragraph.
    function rollPromptUpToHistory(completedText) {
      if (!completedText || !completedText.trim()) return;

      let sentence = completedText.trim();
      // Ensure sentence ends with a full stop / punctuation
      if (!/[.?!]$/.test(sentence)) {
        sentence += '.';
      }
      // Capitalize first letter of sentence
      sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);

      const now = Date.now();
      const isLongPause = (now - lastSentenceTime > 5500);

      // Start a new paragraph after a long pause (> 5.5s) or after 4 sentences
      if (!currentParagraph || isLongPause || sentenceCountInParagraph >= 4) {
        currentParagraph = document.createElement('p');
        currentParagraph.className = 'text-slate-400 hover:text-slate-600 text-base sm:text-lg leading-relaxed font-normal transition-colors';
        continuousTextFlow.appendChild(currentParagraph);
        sentenceCountInParagraph = 0;
      }
      lastSentenceTime = now;

      // Append sentence continuously separated by a space and full stop!
      const span = document.createElement('span');
      span.textContent = (currentParagraph.textContent ? ' ' : '') + sentence;
      currentParagraph.appendChild(span);
      sentenceCountInParagraph++;

      // If user hasn't manually scrolled up, auto-scroll to keep newest line right above the center
      if (!isUserScrolledUp) {
        historyScrollContainer.scrollTop = historyScrollContainer.scrollHeight;
      }
    }

    function rollAiAnswerToHistory(answerText) {
      if (!answerText || !answerText.trim()) return;
      currentParagraph = null; // Next speech will start a clean new paragraph

      const box = document.createElement('div');
      box.className = 'text-xs sm:text-sm text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-200/60 my-2 space-y-1';
      box.innerHTML = `<span class="font-bold text-indigo-500 text-[10px] uppercase tracking-wider block">AI Key Points:</span> ${escapeHtml(answerText)}`;
      continuousTextFlow.appendChild(box);

      if (!isUserScrolledUp) {
        historyScrollContainer.scrollTop = historyScrollContainer.scrollHeight;
      }
    }

    // 3. AI TALKING POINTS RENDERING IN CENTER
    function updateCenterAiContent(rawText) {
      if (!centerAiContent) return;
      const cleanLines = rawText.split('\n').filter(l => l.trim().length > 0);
      let html = '';
      cleanLines.forEach(line => {
        let clean = line.replace(/^\s*[-*•]\s*/, '').replace(/^\s*\d+\.\s*/, '').trim();
        if (clean) {
          html += `
            <div class="flex items-start gap-1.5 leading-snug">
              <span class="text-indigo-600 font-bold shrink-0">⚡</span>
              <span class="text-xs sm:text-sm text-slate-800 font-medium">${escapeHtml(clean)}</span>
            </div>
          `;
        }
      });
      centerAiContent.innerHTML = html || `<p class="text-xs text-indigo-400 italic">Streaming...</p>`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // PIN Submission
    submitPinBtn.addEventListener('click', () => {
      const val = pinInput.value.trim();
      if (val) {
        roomPin = val;
        pinModal.classList.add('hidden');
        if (specWs) specWs.close();
        connectSpectator();
      }
    });

    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitPinBtn.click();
      }
    });

    // Optional Spectator Whisper
    specWhisperToggle.addEventListener('click', () => {
      specWhisperEnabled = !specWhisperEnabled;
      if (specWhisperEnabled) {
        specWhisperToggle.className = 'border border-emerald-500 bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-2xs transition';
        specWhisperText.textContent = 'Audio: ON';
        if ('speechSynthesis' in window) {
          const silent = new SpeechSynthesisUtterance(' ');
          window.speechSynthesis.speak(silent);
        }
      } else {
        specWhisperToggle.className = 'border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-2xs transition';
        specWhisperText.textContent = 'Audio: OFF';
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    });

    function speakSpectatorWhisper(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.replace(/[*_#`-]/g, ''));
      utterance.rate = 1.25;
      window.speechSynthesis.speak(utterance);
    }

    // Auto-connect
    connectSpectator();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
